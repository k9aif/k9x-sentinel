# K9X Sentinel — squad flow definitions (loaded by SquadLoader.load_one).
# No orchestrator field: squads never reference their caller.

squads:
  CollectSquad:
    description: Read every source and store new items (feeds, then the dependency audit).
    agents: [FeedCollectorAgent, DependencyAuditAgent]
    flow:
      - agent: FeedCollectorAgent
        result_key: feeds
      - agent: DependencyAuditAgent
        result_key: dependencies

  AssessSquad:
    description: >
      One item — a free relevance pre-filter, then (only if relevant) screen it,
      compare it with the capability catalog, and triage it. A pre-filtered
      item costs no Guardian and no model call.
    agents: [PrefilterAgent, ContentScreenAgent, GapAnalysisAgent, TriageAgent]
    flow:
      - agent: PrefilterAgent
        result_key: prefilter
      - agent: ContentScreenAgent
        result_key: screened
        when: {key: prefilter.relevant, eq: true}
      - agent: GapAnalysisAgent
        result_key: assessment
        when: {key: prefilter.relevant, eq: true}
      - agent: TriageAgent
        result_key: triage
        when: {key: prefilter.relevant, eq: true}

  RetriageSquad:
    description: Re-send an already assessed finding (Kafka was down) without assessing it again.
    agents: [TriageAgent]
    flow:
      - agent: TriageAgent
        result_key: triage

  DecisionSquad:
    description: A reviewer decided in k9x-hil — record it and act on an approval.
    agents: [DecisionAgent]
    flow:
      - agent: DecisionAgent
        result_key: decision
